                    description: if true there are older WhatsApp messages.
                  nextPage:
                    type: string
                    description: repeat the call with this value a "&after=" argument to get the next
                      page.
                  paged:
                    type: boolean
                    description: if true we used ?page and ?size, not ?after. If this is true then .nextPage
                      and .hasNextPage won't be set.
                required:
                - messages
                - paged
        '400':
          $ref: '#/components/responses/error_400'
        '401':
          $ref: '#/components/responses/error_401'
  /v1/organizations/{orgId}/whatsapp/{messageId}/:
    get:
      summary: Get a single WhatsApp message by ID
      description: Load a WhatsApp message, including its delivery status.
      operationId: getWhatsApp
      tags:
      - WhatsApp
      security:
      - apiToken: []
      parameters:
      - $ref: '#/components/parameters/param_orgid'
      - name: messageId
        in: path
        required: true
        schema:
          type: string
        description: ID of the WhatsApp message.
      responses:
        '200':
          description: OK. We have the message.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/schema_model_whatsapp'
        '401':
          $ref: '#/components/responses/error_401'
        '404':
          description: No such message.
          $ref: '#/components/responses/error_404'
components:
  securitySchemes:
    apiToken:
      bearerFormat: token
      description: "Token based HTTP authentication.\n\nUse the header \"Authorization\". The value must\
        \ be the word \"Token\" followed by your token. For example: \"Authorization: Token aaa111bbb222ccc333\"\
        , NOT \"Authorization: aaa111bbb222ccc333\".\n\nAccess tokens can be retrieved and managed [in\
        \ your User profile](https://app.engagespark.com/profile/api-tokens).\n\nAllowed headers:\n\n\
        \  - Authorization: Token [PERSONAL_ACCESS_TOKEN]"
      type: http
      scheme: token
  parameters:
    param_orgid:
      name: orgId
      in: path
      required: true
      schema:
        type: string
      description: 'engageSPARK ID of the organization.

        You can find this ID in your [Organization Profile](https://app.engagespark.com/organization/info).'
    param_campaignid:
      name: campaignId
      in: path
      required: true
      schema:
        type: string
      description: 'engageSPARK ID of the campaign.

        You can find this ID when editing your campaign, or copy it in the actions drop down in the campaigns
        list.'
    query_page:
      name: page
      in: query
      schema:
        type: integer
      description: The page number to retrieve.
      example: 2
    query_size:
      name: size
      in: query
      schema:
        type: integer
      description: The requested number of items on a page.
      example: 10
    contactid:
      name: contactId
      in: path
      required: true
      schema:
        type: string
      description: 'engageSPARK ID of the contact.

        You get this ID when creating a contact.'
    page:
      name: page
      in: query
      schema:
        type: string
      description: Show this page. Starts at 1!
    size:
      name: size
      in: query
      schema:
        type: string
      description: Used when ?page is set. The default and the maximum is 1000.
    param_filename:
      name: filename
      in: path
      required: true
      schema:
        type: string
      description: The name and extension of the file.
      example: report_01.xlsx
  responses:
    error_401:
      description: No permission.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                description: Error message explaining why access is denied.
                example: Invalid Token
    error_400:
      description: Problem with the request.
      content:
        application/json:
          schema:
            type: object
            required:
            - error
            - errorCode
            properties:
              error:
                type: string
                description: English description of the error. Might change over time.
                example: Too many failed login attempts
              errorCode:
                type: string
                description: Code specific for the error.
                example: login.locked
              context:
                type: object
                description: Optional error fields specific for the errorCode.
    error_500:
      description: Internal server error, something went wrong on the server side. Please contact support.
    error_404:
      description: Not found.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                description: Not found.
                example: Not found
    error_402:
      description: Insufficient funds. Please add funds to your organization's balance and repeat the
        request.
      content:
        application/json:
          schema:
            type: object
            properties:
              error:
                type: string
                description: Error message.
                example: insufficient funds
  schemas:
    properties_daysofweek:
      properties:
        monday:
          type: boolean
        tuesday:
          type: boolean
        wednesday:
          type: boolean
        thursday:
          type: boolean
        friday:
          type: boolean
        saturday:
          type: boolean
        sunday:
          type: boolean
    schema_sub_delay:
      type: object
      description: 'Delays the start of the subscription. If omitted, the subscriptions start immediately.


        You must always set the `value` field. When using the `day` unit, you can additionally set the
        `time` and `timezone` fields. When using the `week` unit, you can additionally set the `time`,
        `timezone`, and `daysOfWeek` fields.


        Note that "0 days 9:00" can yield a different result than "1 day 9:00", depending on the current
        time of day. The former means "the upcoming 9:00" and the latter means "tomorrow''s 9AM". For
        example, if it''s currently 8:30, then the former means the subscription starts in half an hour,
        while the latter means that the subscription starts in 24 hours and 30 minutes.'
      properties:
        unit:
          type: string
          enum:
          - ''
          - second
          - minute
          - hour
          - day
          - week
          - month
          - at
          description: Time unit for the subscription delay.
          example: week
        value:
          type: integer
          description: The number of units. For example, if you set `unit` to `"minute"`, then a `value`
            of `5` delays the subscription by five minutes.
          example: 1
        dayOfWeek:
          type: string
          enum:
          - monday
          - tuesday
          - wednesday
          - thursday
          - friday
          - saturday
          - sunday
          description: Legacy version of `daysOfWeek`, see `daysOfWeek`.
          example: monday
        daysOfWeek:
          type: object
          description: Optional day of the week when the subscription should activate, only relevant for
            'week' unit.
          $ref: '#/components/schemas/properties_daysofweek'
        time:
          type: string
          description: Optional specific time of day when the subscription should activate, required if
            unit is 'day' or 'week'.
          example: 09:00
        timezone:
          type: string
          description: Optional timezone for the specified 'time', defaults to UTC if not provided.
          example: Asia/Manila
        country:
          type: string
          description: Optional two-letter ISO country code, used to determine the timezone if `timezone`
            is not set.
          example: PH
        at:
          type: string
          format: date-time
          description: Specific date and time when the subscription should start, required if unit is
            'at'. If set, overrides all other fields.
          example: '2024-01-15T09:00:00Z'
        relative:
          type: string
          enum:
          - ''
          - previous
          - initial
          description: Relative to what message in the campaign.
    properties_contact:
      properties:
        firstName:
          type: string
          example: Jane
        lastName:
          type: string
          example: Doe
        language:
          type: string
          description: Sets the language field. Used for campaigns that support multiple languages.
          example: Bangla
        groups:
          type: array
          items:
            oneOf:
            - type: integer
            - type: string
          description: List of integer group IDs this contact should be added to.
        customFields:
          type: object
          description: 'Update custom fields as identified by their IDs.


            Empty values are valid, and will remove the current value. Only fields that are provided are
            updated.'
          additionalProperties:
            type: string
          example:
            '120': blue
            '121': soy beans
            '123': ''
        customFieldsByName:
          type: object
          description: 'An alterative way to set Custom fields. The keys of the objects are the names
            of the custom fields. We''ll use the existing group ID, or create a new one if it doesn''t
            exist.

            Empty values are valid, and will remove the current value. Only fields that are provided are
            updated.

            - names are compared case in-sensitive (so if you add "Gender", it''ll re-use an existing
            column "gender").

            - if there are multiple possible matches, then we take the oldest existing custom field.

            - if the same custom field is used in customFields and customFieldsByName, then the value
            in customFieldsByName wins.

            - if the same custom field is given multiple times in customFieldsByName then it''s not defined
            which one wins (`{"color": "green", "COLOR": "red"}`. The custom field color can now be either
            red or green).'
          example:
            color: blue
            produce: soy beans
            beneficiary ID: ''
    schema_substatus:
      type: object
      description: Status of a subscription for a contact.
      properties:
        totalCount:
          type: integer
          description: Total number of subscriptions for this contact.
          example: 3
        inProgressCount:
          type: integer
          description: Number of subscriptions currently in progress.
          example: 1
        doneCount:
          type: integer
          description: Number of subscriptions that have completed.
          example: 2
        unsubbedCount:
          type: integer
          description: Number of subscriptions that have been unsubscribed
          example: 0
        errorCount:
          type: integer
          description: Number of subscriptions that encountered errors.
          example: 0
        withFailuresCount:
          type: integer
          description: Number of subscriptions that had failures.
          example: 0
        activeId:
          type: integer
          description: ID of the active subscription, if any.
          example: 12345
        lastId:
          type: integer
          description: ID of the last subscription processed.
          example: 12345
      required:
      - totalCount
      - inProgressCount
      - doneCount
      - unsubbedCount
      - errorCount
      - withFailuresCount
      - activeId
    schema_contact:
      type: object
      properties:
        id:
          type: integer
          description: Unique engageSPARK ID of the contact.
          example: 12345
        fullPhoneNumber:
          type: string
          description: International phone number of the contact, without leading "+".
          example: '631234567890'
        firstName:
          type: string
          description: First name of the contact.
          example: Mary
        lastName:
          type: string
          description: Last name of the contact.
          example: Sue
        language:
          type: string
          description: Language of the contact.
          example: Vietnamese
        groups:
          type: array
          items:
            type: integer
          description: Group IDs this contact is in. The IDs can be groups or segments.
          example:
          - 26599
          - 26610
          - 26626
        customFields:
          type: object
          description: All the custom field values set.
          additionalProperties:
            type: string
          example:
            '120': blue
            '121': soy beans
        carrier:
          type: string
          description: Name of the carrier.
          example: Vodafone
        createdAt:
          type: string
          format: date-time
          description: Time this contact was created.
          example: '2020-05-28T10:59:45.061156Z'
        updatedAt:
          type: string
          format: date-time
          description: Last time this contact was updated, either the contact itself, or a custom field,
            or groups have changed.
          example: '2020-05-28T10:59:45.061156Z'
        lastUseAt:
          type: string
          format: date-time
          description: Last time this contact was used.
          example: '2020-05-28T10:59:45.061156Z'
        noAutodelete:
          type: boolean
          description: If set, this contact will not be deleted by the organization's contact autodelete.
        withBsuid:
          type: boolean
          description: If true, this contact has a whatsapp business user ID set.
          example: false
        invalid:
          type: boolean
          description: Whether the contact's phone number is invalid
          example: false
        subscription:
          $ref: '#/components/schemas/schema_substatus'
    schema_sms:
      type: object
      required:
      - messageId
      - estimateParts
      - estimateMicro
      - estimate
      - deliveryDeadline
      - to
      - message
      - contactId
      - clientDedup
      - clientPushURL
      - clientRef
      - error
      - dedupMessageId
      properties:
        messageId:
          type: string
          description: engageSPARK message ID. Will be unique.
          example: SMS20240325T122739-500492-1545
        dedupMessageId:
          type: string
          description: The message ID of the original message with the same clientDedup. Only present
            in error responses when clientDedup conflicts.
          example: SMS20240325T122739-500492-1545
        estimateParts:
          type: integer
          description: Number of SMSs used to send the message (estimate).
          example: 2
        estimateMicro:
          type: integer
          description: Price per part, in millionths of a dollar.
          example: 20000
        estimate:
          type: string
          description: Total estimated cost, in USD, rounded down to cents.
          example: '0.02'
        deliveryDeadline:
          type: string
          format: date-time
          description: If there are problems with the telco we'll try to deliver the message until this
            timestamp.
          example: '2024-03-26T12:35:15.530548089Z'
        to:
          type: string
          description: Full phone number of the recipient. Including country code, no leading "+".
          example: '631234567890'
        message:
          type: string
          description: The message as we send it.
        clientDedup:
          type: string
          description: Echo of the "clientDedup" field we received in the request.
        clientPushURL:
          type: string
          description: Echo of the "clientPushURL" field we received in the request.
        clientRef:
          type: string
          description: Echo of the "clientRef" field we received in the request.
        contactId:
          type: integer
          description: ID of the contact.
          example: 12345
        error:
          type: string
          description: Error message, if any.
          example: duplicate clientDedup
        errorCode:
          type: string
          description: Error code, if any.
          example: sms.clientdedup
    schema_model_sms:
      type: object
      properties:
        id:
          type: string
          description: engageSPARK message ID. Will be unique.
          example: SMS20240325T122739-500492-1545
        direction:
          type: string
          enum:
          - egress
          - ingress
          description: Egress or Ingress message
          example: egress
        created:
          type: string
          format: date-time
          description: Time the messages got created. Delivery (if any) will be after this.
          example: '2024-03-26T12:35:15.530548089Z'
        sender:
          type: string
          description: Sender of the message. Won't be present if the user doesn't have permissions to
            see this field.
        recipient:
          type: string
          description: Sender of the message. Won't be present if the user doesn't have permissions to
            see this field.
        contactId:
          type: integer
          description: engageSPARK contact ID.
          example: 123456
        pricePerPart:
          type: integer
          description: The charged price in micro USD per part of the SMS.
          example: 20000
        done:
          type: boolean
          description: If not true engageSPARK will try more deliveries still.
          example: true
        successPartCount:
          type: integer
          description: Number of parts a successful SMS was made of.
          example: 2
        successT:
          type: string
          format: date-time
          description: Time the message got sent.
          example: '2024-03-26T12:35:15.530548089Z'
        message:
          type: string
          description: The message as we (tried to) send. Personalization, if any, will be expanded.
          example: Hello Mary Sue, we will visit your coconut farm Monday 1 April around 12:00.
        error:
          type: string
          description: 'Description what went wrong when passing the SMS to the telco for delivery.

            This is the error you want to look at, if `deliveredToTelco` is `false`.

            Note that this field can be empty while the Delivery Receipt does indicate a problem.'
        deliveryError:
          type: string
          description: 'Delivery Receipt error, if any.

            This is set, if `deliveredToTelco` is `true` and `deliveredToPhone` is `failed`.

            Examples of possible errors:

            - anti-spam filter

            - blocked

            - contact absent

            - contact absent - permanent

            - contact absent - temporary

            - contact error

            - contact phone issue

            - expired

            - message error

            - network error

            - no route

            - not mobile number

            - opted out of promotional messaging

            - unknown

            - unreachable'
        deliveredToTelco:
          type: boolean
          description: 'Was this SMS successfully delivered to our telco partner?


            True if the message is successfully delivered to the telco partner. False if there was an
            error or while the message is still being delivered.


            Note that this is the first step. It does not mean it has reached the handset.'
        deliveredToPhone:
          type: string
          enum:
          - unknown
          - confirmed
          - failed
          description: 'The Delivery Receipt status of this SMS.


            Not all telcos support delivery receipts and they are not always reliable. This varies per
            telco per country. Contact us to know if delivery receipts are available in your program country,
            and how reliable they can be expected to be.


            - unknown – means we haven’t received a delivery receipt from the telecom. This can happen
            either when (a) deliveredToTelco is `false` OR (b) deliveredToTelco is `true` but the vendor
            hasn’t sent us the delivery receipt, yet.

            - confirmed – means we received the delivery receipt from the telecom and it says that, yes,
            the SMS was delivered.

            - failed – means we received the delivery receipt from the telecom and it says the SMS could
            not be delivered.'
        client_ref:
          type: string
          description: The value set in the "clientRef" value in the original "send SMS" API call. engageSPARK
            doesn't do anything with this value, besides returning it here.
        chargedMicro:
          type: integer
          description: The charged price in micro USD in total. In case of refunds this can be 0.
          example: 40000
        chargedHuman:
          type: string
          description: The charged price in USD as string. Has 2 digits, but 6 if there charge uses amounts
            smaller than cents.
          example: '0.40'
    schema_file:
      type: object
      required:
      - filename
      - title
      - category
      - transcript
      - size
      - sha1
      - upload
      - thumb
      properties:
        filename:
          type: string
          description: The name of the file.
          example: 01-example.mp3
        title:
          type: string
          description: The title of the file.
          example: 01 - Example.mp3
        category:
          type: string
          description: The category of the file given on upload.
          example: uploads
        transcript:
          type: string
          description: Transcript previously set. This field isn't set automatically.
          example: Lovely weather today.
        size:
          type: number
          description: The size of the file in bytes.
          example: 123456
        sha1:
          type: string
          description: The SHA1 checksum of the file.
          example: 2fd4e1c67a2d28fced849ee1bb76e7391b93eb12
        upload:
          type: string
          format: date-time
          description: The date and time when the file was uploaded.
          example: '2023-05-23T13:45:00Z'
        thumb:
          type: boolean
          description: We automatically generate a thumbnail for the file if the file is a video file
            and set this property to true, which is available as /thumb/<filename>.
          example: false
    schema_topup:
      type: object
      properties:
        id:
          type: string
          description: engageSPARK ID
        done:
          type: boolean
          description: If false the Top-Up hasn't been successful yet, but is still being retried.
        success:
          type: boolean
          description: If true we executed the Top-Up successfully. See "error".
        error:
          type: string
          description: Error describing the problem, if any.
        clientRef:
          type: string
          description: As given in the original request.
        topupCurrency:
          type: string
          description: The currency used, e.g. USD.
        topupReceived:
          type: number
          description: The amount the user got on their phone.
        priceCharged:
          type: number
          description: What you got charged.
        firstName:
          type: string
          description: If the user has a contact in the engageSPARK system, this is the first name of
            that contact.
        lastName:
          type: string
          description: If the user has a contact in the engageSPARK system, this is the last name of that
            contact.
    schema_model_whatsapp:
      type: object
      properties:
        id:
          type: string
          description: engageSPARK message ID. Will be unique.
          example: WAIN20250613T114721-763096
        direction:
          type: string
          enum:
          - egress
          - ingress
          description: Egress or Ingress message
          example: egress
        created:
          type: string
          format: date-time
          description: Time the messages got created. Delivery (if any) will be after this.
          example: '2024-03-26T12:35:15.530548089Z'
        sender:
          type: string
          description: Sender of the message. Won't be present if the user doesn't have permissions to
            see this field.
        recipient:
          type: string
          description: Recipient of the message. Won't be present if the user doesn't have permissions
            to see this field.
        contactId:
          type: integer
          description: engageSPARK contact ID.
          example: 123456
        done:
          type: boolean
          description: If not true engageSPARK will try more deliveries still.
          example: true
        read:
          type: boolean
          example: true
        readAt:
          type: string
          format: date-time
          description: When we got the "read" confirmation. Only relevant if .read is true.
          example: '2024-03-26T12:35:15Z'
        successT:
          type: string
          format: date-time
          description: Time the message got sent.
          example: '2024-03-26T12:35:15Z'
        message:
          type: string
          description: The message as we (tried to) send. Personalization, if any, will be expanded.
          example: Hello Mary Sue, we will visit your coconut farm Monday 1 April around 12:00.
        imageFiles:
          type: array
          items:
            type: string
          description: Images attached to the message. Load them via /v1/organizations/${ORGID}/files/[filename]
          example:
          - cat.jpg
        audioFiles:
          type: array
          items:
            type: string
          description: Audio files attached to the message. Load them via /v1/organizations/${ORGID}/files/[filename]
          example:
          - cat.mp3
        videoFiles:
          type: array
          items:
            type: string
          description: Video files attached to the message. Load them via /v1/organizations/${ORGID}/files/[filename]
          example:
          - cat.mov
        documentFiles:
          type: array
          items:
            type: string
          description: Documents attached to the message. Load them via /v1/organizations/${ORGID}/files/[filename]
          example:
          - cat.pdf
        fullFilePaths:
          type: array
          items:
            type: string
          description: Full file paths for all attached files (images, audio, video, documents). These
            will be the same as the imageFiles, audioFiles, videoFiles, and documentFiles combined, but
            here they are not just the filename, but the full paths to download the files.
          example:
          - /v1/organizations/123/files/cat.jpg
        location:
          type: object
          description: Set if the contact sends their location. Only supported for inbound messages (direction=ingress).
          properties:
            latitude:
              type: string
              example: '43.586399078369'
            longitude:
              type: string
              example: '1.4468078613281'
            address:
              type: string
              example: 39 Grande Rue Saint-Michel, Toulouse, Occitanie 31400
            label:
              type: string
              example: Tower Of London
        content:
          type: object
          description: object complicated WhatsApp messages.
        error:
          type: string
          description: 'Description what went wrong when passing the SMS to the telco for delivery.

            This is the error you want to look at, if `deliveredToTelco` is `false`.

            Note that this field can be empty while the Delivery Receipt does indicate a problem.'
        deliveryError:
          type: string
          description: 'Delivery Receipt error, if any.

            This is set, if `deliveredToTelco` is `true` and `deliveredToPhone` is `failed`.

            Examples of possible errors:

            - anti-spam filter

            - blocked

            - contact absent

            - contact absent - permanent

            - contact absent - temporary

            - contact error

            - contact phone issue

            - expired

            - message error

            - network error

            - no route

            - not mobile number

            - opted out of promotional messaging

            - unknown

            - unreachable'
        deliveredToPhone:
          type: string
          enum:
          - unknown
          - confirmed
          - failed
          description: 'The Delivery Receipt status of this SMS.


            Not all telcos support delivery receipts and they are not always reliable. This varies per
            telco per country. Contact us to know if delivery receipts are available in your program country,
            and how reliable they can be expected to be.


            - unknown – means we haven’t received a delivery receipt from the telecom. This can happen
            either when (a) deliveredToTelco is `false` OR (b) deliveredToTelco is `true` but the vendor
            hasn’t sent us the delivery receipt, yet.

            - confirmed – means we received the delivery receipt from the telecom and it says that, yes,
            the SMS was delivered.

            - failed – means we received the delivery receipt from the telecom and it says the SMS could
            not be delivered.'
        charged:
          type: integer
          description: The charged price in micro USD in total. In case of refunds this can be 0.
          example: 40000
