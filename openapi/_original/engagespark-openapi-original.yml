openapi: 3.1.0
info:
  title: engageSPARK API
  version: 1.0.0
  license:
    name: MIT
    identifier: MIT
    url: https://spdx.org/licenses/MIT.html
  termsOfService: https://www.engagespark.com/terms-of-service/
  description: 'API documentation for [engageSPARK](https://www.engagespark.com/).


    To use this API you need an "Access token", which can be retrieved from your [User profile](https://app.engagespark.com/profile/api-tokens).
    In the API calls you need to set the header "Authorization" with the value "Token" followed by your
    token. For example: "Authorization: Token aaa111bbb222ccc333", NOT "Authorization: aaa111bbb222ccc333".


    Please see the [documentation for other integration methods](https://www.engagespark.com/support/how-can-i-use-your-api/)
    such as inbound SMS rules, Zapier zaps, or Make API Request actions.'
servers:
- url: https://api.engagespark.com
security:
- apiToken: []
paths:
  /v1/organizations/{orgId}/balance.json:
    get:
      summary: Get organization balance
      description: Get the current balance of the organization.
      operationId: getOrgBalance
      tags:
      - Balance
      security:
      - apiToken: []
      parameters:
      - $ref: '#/components/parameters/param_orgid'
      responses:
        '200':
          description: Show the balance
          content:
            application/json:
              schema:
                type: object
                required:
                - balance
                - balanceMicro
                - balanceHuman
                - autoRecharge
                - autoRechargeThreshold
                - autoRechargeAmount
                properties:
                  balance:
                    type: number
                    description: Balance in USD, up to 6 digits.
                    example: 3.141592
                  balanceMicro:
                    type: integer
                    format: int64
                    description: Balance in micro USD. Divide by 1_000_000 to get dollars.
                    example: 3141592
                  balanceHuman:
                    type: string
                    description: Balance in USD, rounded (down) to cents, always has 2 digits after the
                      dot.
                    example: '3.14'
                  autoRecharge:
                    type: boolean
                    description: Autorecharge does a Credit Card transaction if the balance falls under
                      a certain threshold.
                    example: true
                  autoRechargeThreshold:
                    type: number
                    description: Autorecharge threshold in USD.
                    example: 50
                  autoRechargeAmount:
                    type: number
                    description: Autorecharge amount in USD.
                    example: 100
        '401':
          $ref: '#/components/responses/error_401'
  /v1/organizations/{orgId}/engagements/{campaignId}/subscribe:
    post:
      summary: Subscribe a contact to a campaign
      description: 'Add a contact to a campaign. The campaign must be launched, not stopped, and it must
        be open to new subscriptions.


        Exactly one of "contactId", "fullPhoneNumber", or "phoneNumber" with "phoneNumberCountry" needs
        to be set.


        This API will return an error if the contact already has an active (`done == false`) subscription.
        However, a user can have multiple subscriptions with the same campaign over time. You can set
        the `allowResubscribe` flag to false if you want the request to fail in case the user had or has
        any subscription to this campain.


        By default, the new subscriptions start right away. Use the `delay` field to schedule new subscriptions
        into the future.'
      operationId: subscribeContact
      tags:
      - Campaigns
      security:
      - apiToken: []
      parameters:
      - $ref: '#/components/parameters/param_orgid'
      - $ref: '#/components/parameters/param_campaignid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                contactId:
                  oneOf:
                  - type: integer
                  - type: string
                  description: engageSPARK ID of the contact. If provided, the contact must exist and
                    be part of the organization.
                  example: '3456789'
                fullPhoneNumber:
                  type: string
                  description: Full phone number including the country code, may have a leading "+".
                  example: '631234567890'
                phoneNumber:
                  type: string
                  description: Country part of the phone number. If this is used phoneNumberCountry must
                    also be set.
                  example: '1234567890'
                phoneNumberCountry:
                  type: string
                  description: Two letter ISO code of the country. Used with the "phoneNumber" option.
                  example: PH
                allowResubscribe:
                  anyOf:
                  - type: boolean
                  - type: 'null'
                  description: Should a contact be resubscribed if it has a previous, already finished
                    subscription?
                  example: false
                timeZone:
                  type: string
                  description: Overrides the timezones used to calculate message times in Drip and Reminder
                    campaigns.
                  default: ''
                  example: Asia/Bangkok
                delay:
                  $ref: '#/components/schemas/schema_sub_delay'
                args:
                  type: object
                  description: Campaign-specific arguments passed to the campaign.
                  additionalProperties: true
                  example: {}
                contact:
                  type: object
                  description: 'Update the contact with the given fields before subscribing it.


                    All fields are optional. Fields that are not provided will not be updated.'
                  $ref: '#/components/schemas/properties_contact'
      responses:
        '200':
          description: Subscription successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  runId:
                    type: integer
                    description: Unique subscription ID assigned to the contact.
                  contactId:
                    type: integer
                    description: ID of the contact that has been subscribed.
        '400':
          $ref: '#/components/responses/error_400'
        '401':
          $ref: '#/components/responses/error_401'
        '500':
          $ref: '#/components/responses/error_500'
  /v1/organizations/{orgId}/engagements/{campaignId}/unsubscribe:
    post:
      summary: Unsubscribe a contact from a campaign
      description: 'Unsubscribe a single contact from a campaign.


        The call will cancel any subscription from the given contact ID, if there is any active subscription.
        Because this is actually an abort the subscription will be listed as "error" in reports.


        It''s fine to call this if there are no, or no active, subscriptions for the contact.'
      operationId: unsubscribeContact
      tags:
      - Campaigns
      security:
      - apiToken: []
      parameters:
      - $ref: '#/components/parameters/param_orgid'
      - $ref: '#/components/parameters/param_campaignid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - contactId
              properties:
                contactId:
                  oneOf:
                  - type: integer
                  - type: string
                  description: engageSPARK ID of the contact.
                  example: '3456789'
      responses:
        '200':
          description: Unsubscribe successful
          content:
            application/json:
              schema:
                type: object
                properties:
                  runId:
                    type: integer
                    description: Subscription ID, if any.
        '400':
          $ref: '#/components/responses/error_400'
        '401':
          $ref: '#/components/responses/error_401'
        '500':
          $ref: '#/components/responses/error_500'
  /v1/organizations/{orgId}/contacts/:
    get:
      summary: List all contacts for an organization
      description: "List all contacts for an organization, with optional filtering and pagination.\n\n\
        You can filter contacts by:\n  - Search terms (searches names and phone numbers)\n  - Group membership\n\
        \  - Full phone number\n  - Local phone number + Country\n  - Custom conditions\n  - Subscription\
        \ status\n  - No-autodelete setting\n  - WhatsApp Business User ID set\n\n\nUse the `subscriptionstatus`\
        \ parameter to include subscription status information for a specific campaign. Use the `subscriptionfilter`\
        \ parameter to filter by subscription status."
      operationId: listContacts
      tags:
      - Contacts
      security:
      - apiToken: []
      parameters:
      - $ref: '#/components/parameters/param_orgid'
      - $ref: '#/components/parameters/query_page'
      - $ref: '#/components/parameters/query_size'
      - name: search
        in: query
        required: false
        schema:
          type: string
        description: Search term to filter contacts by name or phone number
        example: john
      - name: phonenumber
        in: query
        required: false
        schema:
          type: string
        description: Filter by international phone number (E164, with optional leading +). If "region"
          is given this should be a local phone number.
        example: '1234567890'
      - name: region
        in: query
        required: false
        schema:
          type: string
        description: Used together with phonenumber, this is the country 2 letter name.
        example: PH
      - name: groupid
        in: query
        required: false
        schema:
          type: integer
        description: Filter by group ID
        example: 123
      - name: noautodelete
        in: query
        required: false
        schema:
          type: boolean
        description: Filter by no-autodelete setting
        example: true
      - name: whatsappready
        in: query
        required: false
        schema:
          type: boolean
        description: Filter by contacts which have WhatsApp Business User ID set
        example: true
      - name: conditions
        in: query
        required: false
        schema:
          type: string
        description: JSON string of custom conditions for filtering see schema_condition.yaml
      - name: subscriptionstatus
        in: query
        required: false
        schema:
          type: integer
        description: Campaign ID to include subscription status information
        example: 456
      - name: subscriptionfilter
        in: query
        required: false
        schema:
          type: string
          enum:
          - is
          - isnot
          - was
        description: Filter by subscription status (requires subscriptionstatus parameter)
        example: is
      responses:
        '200':
          description: List of contacts
          content:
            application/json:
              schema:
                type: object
                properties:
                  total:
                    type: integer
                    description: Total number of contacts matching the filter
                    example: 250
                  orgTotal:
                    type: integer
                    description: Total number of contacts in the organization
                    example: 1000
                  contacts:
                    type: array
                    items:
                      $ref: '#/components/schemas/schema_contact'
                    description: Array of contact objects
                required:
                - total
                - orgTotal
                - contacts
        '400':
          $ref: '#/components/responses/error_400'
        '401':
          $ref: '#/components/responses/error_401'
        '500':
          $ref: '#/components/responses/error_500'
    post:
      summary: Create a new contact in the system
      description: 'Add a new contact to the system. This will return a contact ID which can be used in
        other engageSPARK APIs.


        Most APIs will create a contact on the fly when you use a new phone number, but creating it explicitly
        gives you more control over the contact fields (such as "first name").


        Exactly one of "fullPhoneNumber", or "phoneNumber" with "phoneNumberCountry" needs to be set.


        Using this API you can create multiple different contacts with the same phone number.'
      operationId: createContact
      tags:
      - Contacts
      security:
      - apiToken: []
      parameters:
      - $ref: '#/components/parameters/param_orgid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullPhoneNumber:
                  type: string
                  description: Full phone number including the country code, may have a leading "+".
                  example: '631234567890'
                phoneNumber:
                  type: string
                  description: Country part of the phone number. If this is used `phoneNumberCountry`
                    must also be set.
                  example: '1234567890'
                phoneNumberCountry:
                  type: string
                  description: Two letter ISO code of the country. Used with the `phoneNumber` option.
                  example: PH
                firstName:
                  type: string
                  description: First name of the contact.
                  example: Mary
                lastName:
                  type: string
                  description: Last name of the contact.
                  example: Sue
                language:
                  type: string
                  description: Language is free-form, you can use any standard or system, or leave it
                    empty. The Language field is used in multi language campaigns to decide which version
                    of a message or call to use.
                  example: Vietnamese
                groups:
                  type: array
                  items:
                    oneOf:
                    - type: integer
                    - type: string
                  description: List of group IDs of which this contact will be a member. Values can be
                    either integers or the string version of integers.
                  example:
                  - 1
                  - 3
                  - 144
                  - 52
                customFields:
                  type: object
                  description: Custom field values. The keys of the object are the engageSPARK integer
                    ID of the custom field, and the value is a free-form string.
                  additionalProperties:
                    type: string
                  example:
                    '42': green
                customFieldsByName:
                  type: object
                  description: "An alternative way to set custom fields. It's the same idea as `customFields`,\
                    \ but the keys of the objects are the names of the custom fields. We'll use the existing\
                    \ group ID or create a new one if it doesn't exist.\n- names are compared case in-sensitive\
                    \ (so if you add \"Gender\", it'll re-use an existing column \"gender\").\n- if there\
                    \ are multiple possible matches, then we take the oldest existing custom field.\n\
                    - if the same custom field is used in `customFields` and `customFieldsByName`, then\
                    \ the value in customFieldsByName wins.\n- if the same custom field is given multiple\
                    \ times in `customFieldsByName` then it's not defined which one wins (`{\"color\"\
                    : \"green\", \"COLOR\": \"red\"}`).\n  The custom field color can now be either red\
                    \ or green)."
                  example:
                    Favorite color: green
                noAutodelete:
                  type: boolean
                  description: Do not automatically delete this contact if contact autodeletion is enabled
                    for this org. You can still delete it manually.
      responses:
        '200':
          description: Contact created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/schema_contact'
        '400':
          $ref: '#/components/responses/error_400'
        '401':
          $ref: '#/components/responses/error_401'
        '500':
          $ref: '#/components/responses/error_500'
  /v1/organizations/{orgId}/contacts/{contactId}/:
    get:
      summary: Get a single contact by ID
      description: 'Load a contact with all groups, segments, and custom fields.


        Use the `subscriptionstatus` parameter to include subscription status information for a specific
        campaign.'
      operationId: getContact
      tags:
      - Contacts
      security:
      - apiToken: []
      parameters:
      - $ref: '#/components/parameters/param_orgid'
      - $ref: '#/components/parameters/contactid'
      - name: subscriptionstatus
        in: query
        required: false
        schema:
          type: integer
        description: Campaign ID to include subscription status information
        example: 456
      responses:
        '200':
          description: Contact created
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/schema_contact'
        '401':
          $ref: '#/components/responses/error_401'
        '404':
          description: Contact not found.
          content:
            application/json:
              schema:
                type: object
                required:
                - error
                - errorCode
                properties:
                  error:
                    type: string
                    description: Not found.
                    example: Not found
                  errorCode:
                    type: string
                    description: This is "contact.notfound"
                    example: contact.notfound
        '500':
          $ref: '#/components/responses/error_500'
    put:
      summary: Update an existing contact
      description: Update a contact. Only fields that are set will be updated.
      operationId: updateContact
      tags:
      - Contacts
      security:
      - apiToken: []
      parameters:
      - $ref: '#/components/parameters/param_orgid'
      - $ref: '#/components/parameters/contactid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              properties:
                fullPhoneNumber:
                  type: string
                  description: Full phone number including the country code, may have a leading "+".
                  example: '631234567890'
                firstName:
                  type: string
                  description: First name of the contact.
                  example: Mary
                lastName:
                  type: string
                  description: Last name of the contact.
                  example: Sue
                language:
                  type: string
                  description: Language is free form, you can use any standard or system, or leave it
                    empty. The Language field is used in multi language campaigns to decide which version
                    of a message or call to use.
                  example: Vietnamese
                groups:
                  type: array
                  items:
                    oneOf:
                    - type: integer
                    - type: string
                  description: List of group IDs of which this contact will be a member. Values can be
                    either integers or the string version of integers.
                  example:
                  - 1
                  - 3
                  - 144
                  - 52
                customFields:
                  type: object
                  description: 'Custom field values. The keys of the object are the engageSPARK integer
                    ID of the custom field, and the value is a free form string.

                    Groups which aren''t set aren''t updated. Set value to an empty string to delete the
                    value.'
                  additionalProperties:
                    type: string
                  example:
                    '42': green
                customFieldsByName:
                  type: object
                  description: An alternative way to set Custom fields. It's the same idea as `customFields`,
                    but the keys of the objects are the names of the custom fields. See the documentation
                    in "Create Contact".
                  example:
                    Favorite color: green
                noAutodelete:
                  type: boolean
                  description: Do not automatically delete this contact if contact autodeletion is enabled
                    for this org. You can still delete it manually.
      responses:
        '200':
          description: Contact updated
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/schema_contact'
        '400':
          $ref: '#/components/responses/error_400'
        '401':
          $ref: '#/components/responses/error_401'
        '500':
          $ref: '#/components/responses/error_500'
    delete:
      summary: Delete a contact from the system
      description: Delete a contact. Will return a 404 if the contact did not exist.
      operationId: deleteContact
      tags:
      - Contacts
      security:
      - apiToken: []
      parameters:
      - $ref: '#/components/parameters/param_orgid'
      - $ref: '#/components/parameters/contactid'
      responses:
        '200':
          description: Contact deleted
          content:
            application/json:
              schema:
                type: object
                description: Empty JSON reply.
        '401':
          $ref: '#/components/responses/error_401'
        '404':
          $ref: '#/components/responses/error_404'
        '500':
          $ref: '#/components/responses/error_500'
  /v1/sms/contact:
    post:
      summary: Send an SMS to a contact
      description: 'Send a single SMS to a contact. If there is no existing contact with the phone number
        a contact will be created.


        Unicode and multi-part SMS are supported. See `message` for details.


        Exactly one of "contactId", "fullPhoneNumber", or "phoneNumber" with "phoneNumberCountry" need
        to be set.


        Retries: The SMS API automatically re-tries failed messages as often as possible within 24 hours
        by default. To know until when we’ll keep retrying your message, you can refer to the deliveryDeadline
        of your POST request.


        Testing frequency: In many countries, mobile network operators limit the number of SMS you can
        send to a single number per minute often to 5 SMS/number/minute. If you send more than five SMS
        to a single number within a minute, some messages may not get through and will be lost.


        This is the normal API for sending an SMS.'
      operationId: sendSmsContact
      tags:
      - SMS
      security:
      - apiToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - orgId
              - from
              - message
              properties:
                orgId:
                  oneOf:
                  - type: integer
                  - type: string
                  description: ID of the organization. It can be a string or a number. You can find it
                    in your [Organization Profile](https://app.engagespark.com/organization/info).
                from:
                  type: string
                  description: Sender ID. In general these need to be set, unless you use a default one.
                message:
                  type: string
                  description: 'The content of the message. A message can be up to 7 parts long; longer
                    messages will be rejected.


                    You can personalize the SMS using the contact''s data, for example the first name.
                    Example: `Hello {{contact.firstName}}`


                    In many countries, Unicode characters can be used. However, country-specific GSM 03.38
                    code pages are generally not supported.


                    ⚠️ Please note that when using unicode-characters, the SMS length calculation changes.
                    Read more about [SMS character limits](https://www.engagespark.com/support/sms-character-limit/).'
                clientDedup:
                  type: string
                  description: If not empty; if we have already sent a message with the given value we
                    won't send the message again. This is useful when a POST failed due to network errors.
                clientPushURL:
                  type: string
                  description: Whenever we receive a delivery receipt we POST to this URL.
                clientRef:
                  type: string
                  description: ID we'll return in lists of SMSs. The ID can be anything and doesn't need
                    to be unique. engageSPARK doesn't do anything with this.
                contactId:
                  oneOf:
                  - type: integer
                  - type: string
                  description: engageSPARK ID of the contact. If provided, the contact must exist and
                    be part of the organization.
                fullPhoneNumber:
                  type: string
                  description: 'Full phone number including the country code; it may have a leading "+".


                    This number needs to have an international dialing code.


                    For example, for a number from the Philippines (with the dialing code 63), 639123456789
                    would be correct, whereas 9123456789 would be missing the dialing code. If you are
                    not sure about the dialing code of the country you want to send calls or SMS to, [check
                    this Wikipedia article](https://en.wikipedia.org/wiki/List_of_country_calling_codes#Ordered_by_code)
                    on dialing codes.'
                  example: '631234567890'
                phoneNumber:
                  type: string
                  description: Country part of the phone number. If this is used phoneNumberCountry must
                    also be set.
                  example: '1234567890'
                phoneNumberCountry:
                  type: string
                  description: Two-letter ISO code of the country. Used with the "phoneNumber" option.
                  example: PH
                to:
                  type: string
                  description: Legacy; same as "fullPhoneNumber".
      responses:
        '200':
          description: OK. All fields look good and we've queued the message for delivery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/schema_sms'
        '400':
          description: Problem with the request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Description of the error.
        '401':
          $ref: '#/components/responses/error_401'
        '402':
          $ref: '#/components/responses/error_402'
        '409':
          description: Request with duplicated "clientDedup" field. This new request was ignored, as the
            original has been executed before. All the response fields are the same as the "200" response.
  /v1/sms/phonenumber:
    post:
      summary: Send SMS without contact
      description: 'Single SMS to a phone number without creating or using a contact.


        If needed the message will be sent in multiple parts, which should automatically be reassembled
        on the user''s phone.


        Exactly one of "fullPhoneNumber", or "phoneNumber" with "phoneNumberCountry" need to be set.'
      operationId: sendSmsPhonenumber
      tags:
      - SMS
      security:
      - apiToken: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - orgId
              - from
              - message
              properties:
                orgId:
                  oneOf:
                  - type: integer
                  - type: string
                  description: ID of the organization. It can be a string or a number. You can find it
                    in your [Organization Profile](https://app.engagespark.com/organization/info).
                from:
                  type: string
                  description: Sender ID. In general these need to be set, unless you use a default one.
                message:
                  type: string
                  description: 'The content of the message. A message can be up to 7 parts long; longer
                    messages will be rejected.


                    Personalized messages are not supported in this API.


                    In many countries, Unicode characters can be used. Country-specific GSM 03.38 code
                    pages, however, are generally not supported.


                    ⚠️ Please note that when using unicode-characters, the SMS length calculation changes.
                    Read more about [SMS character limits](https://www.engagespark.com/support/sms-character-limit/).'
                clientDedup:
                  type: string
                  description: If not empty; if we already send a message with the given value we won't
                    send a message again. Useful when a POST failed thanks to network errors.
                clientPushURL:
                  type: string
                  description: Whenever we get a delivery receipt we POST to this URL.
                clientRef:
                  type: string
                  description: ID we'll return in lists of SMSs. Can be anything and doesn't need to be
                    unique. engageSPARK doesn't do anything with this.
                fullPhoneNumber:
                  type: string
                  description: Full phone number including the country code, may have a leading "+".
                  example: '631234567890'
                phoneNumber:
                  type: string
                  description: Country part of the phone number. If this is used phoneNumberCountry must
                    also be set.
                  example: '1234567890'
                phoneNumberCountry:
                  type: string
                  description: Two letter ISO code of the country. Used with the "phoneNumber" option.
                  example: PH
                to:
                  type: string
                  description: Legacy, same as "fullPhoneNumber".
      responses:
        '200':
          description: OK. All fields look good and we've queued the message for delivery.
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/schema_sms'
        '400':
          description: Problem with the request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Description of the error.
        '401':
          $ref: '#/components/responses/error_401'
        '402':
          $ref: '#/components/responses/error_402'
        '409':
          description: Request with duplicated "clientDedup" field. This new request was ignored, as the
            original has been executed before. All the response fields are the same as the "200" response.
  /v1/organizations/{orgId}/messages/:
    get:
      summary: List SMSs for an organization
      description: 'List SMSs. Newest first.


        The number of results per API call is limited. Either use "nextPage" and "after" to get more results,
        which work as a cursor, and do not change as new messages come in. Or use "page" and "size", which
        are classical paging, and might change as new messages come in.'
      operationId: getSmsList
      tags:
      - SMS
      security:
      - apiToken: []
      parameters:
      - $ref: '#/components/parameters/param_orgid'
      - name: after
        in: query
        schema:
          type: string
