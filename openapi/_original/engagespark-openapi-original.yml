  /v1/organizations/{orgId}/topup/:
    post:
      summary: Send airtime top-up to a phone number
      description: 'With the engageSPARK Airtime top-up API, you can send prepaid airtime to anyone on
        the fly. In some countries, airtime is known as prepaid phone credit, mobile credit, or load top-up.


        We are able to send very specific amounts of airtime per mobile network operator in each country.  For
        example, we cannot send 25 Philippine pesos of airtime to a mobile phone on the Smart mobile network
        in the Philippines, but we can send 25 pesos to a mobile phone on the Globe mobile network. The
        amounts available differ by mobile network operator (telco) and by country.


        With these limitations in mind, we wanted to make this API super easy to use. We didn’t want you
        to worry about which mobile network operator a phone number is on for you to be able to easily
        send prepaid airtime to that phone number. So, to simplify things, we created our Airtime top-up
        API with two parameters: the `maxAmount` parameter and the `desiredAmount` parameter.


        **maxAmount Parameter**


        In the `maxAmount` parameter, you specify the maximum amount you want to send to the phone number.  If
        that amount is available, we’ll send that amount; if it’s not available, then we’ll send the closest
        amount available that is smaller than the `maxAmount` you specified.


        For example, if you pass a phone number on the Globe network in the Philippines and a `maxAmount`
        of 25, we’ll send 25 pesos to that phone number because that’s an available amount for mobile
        phones on the Globe network.  But if you pass a phone number on the Smart network in the Philippines
        and a maxAmount of 25, we’ll send that phone number 20 pesos of airtime because that’s the closest
        amount available that is smaller than 25. Please refer to our [pricing table](https://www.engagespark.com/support/airtime-topup-transfer-api-global-pricing/)
        to see the available amounts.


        **desiredAmount Parameter**


        The `desiredAmount` parameter, which is optional but recommended, flips the perspective of the
        API.  By passing a `desiredAmount`, you can specify the top-up amount you prefer to send to the
        phone number.


        If the `desiredAmount` is available for the phone number, then we will send that amount.  If it
        is not available, then we will send the next amount higher that is available, but no higher than
        the `maxAmount`.


        For example, if you pass a phone number on the Smart network in the Philippines, a `desiredAmount`
        of 20, and a `maxAmount` of 30, then we’ll send 20 pesos to that phone number because that’s an
        available amount for mobile phones on the Smart network. But if you pass a phone number on the
        Globe network in the Philippines with the same `desiredAmount` and `maxAmount` parameters, we’ll
        send 25 pesos to that phone number because that’s the closest amount available that is greater
        than or equal to the `desiredAmount` of 20 and less than or equal to the `maxAmount` of 30 for
        mobile phones on the Globe network. As mentioned above, you can refer to our [pricing table](https://www.engagespark.com/support/airtime-topup-transfer-api-global-pricing/)
        to see the available amounts.


        **Currencies**


        For most countries, we are able to send airtime in local currency; in some countries, we can send
        airtime only in USD. The recipient will receive the airtime in their local currency, but the conversion
        from USD to the local currency will occur at the time of the transfer, so the received amount
        may be slightly different each time depending on exchange rates.  Moreover, in countries in which
        we can send in local currency, there are some circumstances where a slightly higher amount will
        be sent than what you specify, but you will still be charged what is listed in our pricing table
        for the amount you specify. Once again, please refer to our [pricing table](https://www.engagespark.com/support/airtime-topup-transfer-api-global-pricing/)
        to see the currencies and amounts available per telco per country.


        **Phone number / Contact**


        Exactly one of `contactId`, `fullPhoneNumber`, or `phoneNumber` with `phoneNumberCountry` needs
        to be set.'
      operationId: sendOrgTopup
      tags:
      - Top-Up
      security:
      - apiToken: []
      parameters:
      - $ref: '#/components/parameters/param_orgid'
      requestBody:
        required: true
        content:
          application/json:
            schema:
              type: object
              required:
              - maxAmount
              properties:
                maxAmount:
                  oneOf:
                  - type: integer
                  - type: string
                  description: We make the topup closest to this amount (but not over). See the request
                    description for examples and a more in-depth discussion.
                desiredAmount:
                  oneOf:
                  - type: integer
                  - type: string
                  description: We try to use the top-up closest to this amount. Optional but recommended.
                    See the request description for examples and a more in-depth discussion.
                clientRef:
                  type: string
                  description: ID we will return in lists of top-ups. It can be anything and does not
                    need to be unique. engageSPARK does not do anything with this.
                async:
                  type: boolean
                  description: If not set or false we will not return until the topup is finished. Since
                    this can take up to 10 minutes this might cause problems with timeouts. It is recommended
                    to set async to true, and then check the result.
                test:
                  type: boolean
                  description: If true we do not do the actual top-up, but we return what we would have
                    done.
                contactId:
                  oneOf:
                  - type: integer
                  - type: string
                  description: engageSPARK ID of the contact.
                fullPhoneNumber:
                  type: string
                  description: Full phone number including the country code, may have a leading "+".
                  example: '631234567890'
                phoneNumber:
                  type: string
                  description: Country part of the phone number. If this is used phoneNumberCountry must
                    also be set.
                  example: '1234567890'
                phoneNumberCountry:
                  type: string
                  description: Two letter ISO code of the country. Used with the "phoneNumber" option.
                  example: PH
      responses:
        '200':
          description: OK. All fields look good and we have executed the top-up.
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: engageSPARK ID
                  currency:
                    type: string
                    description: The currency we used.
                  amountSent:
                    type: number
                    description: The amount the user got on their phone.
                  price:
                    type: number
                    description: What you got charged.
                  queued:
                    type: boolean
                    description: Always false for status '200', always true for status '202'.
        '202':
          description: "Queued.\n\nEither \"async\" was set, or we did not manage to do the top-up right\
            \ away. The top-up will be retried a few more times for a maximum of 5 hours.\n\nThe exact\
            \ schedule:\n\n - 1st retry: scheduled 1 minute after the initial request\n\n - 2nd retry:\
            \ scheduled 2 minutes after the previous request\n\n - 3rd retry: scheduled 5 minutes after\
            \ the previous request\n\n - 4th retry: scheduled 30 minutes after the previous request\n\n\
            \ - 5th retry: scheduled 60 minutes after the previous request\n\n - 6th retry: scheduled\
            \ 120 minutes after the previous request"
          content:
            application/json:
              schema:
                type: object
                properties:
                  id:
                    type: string
                    description: engageSPARK ID
                  currency:
                    type: string
                    description: The currency we used.
                  amountSent:
                    type: number
                    description: The amount the user got on their phone.
                  price:
                    type: number
                    description: What you got charged.
                  queued:
                    type: boolean
                    description: Always false for status '200', always true for status '202'.
        '400':
          description: Problem with the request.
          content:
            application/json:
              schema:
                type: object
                properties:
                  error:
                    type: string
                    description: Description of the error.
        '401':
          $ref: '#/components/responses/error_401'
