    post:
      summary: Upload files to storage
      description: 'Upload files to our storage system. This uses the basic "file upload" mechanism browsers
        use (multipart).

        We store the filename (without the path) as the title field in the file record. The returned filename
        is the unique identifier for the file. It is based on the title to make nice paths.

        You can upload multiple files. If there''s only 1 file this endpoint will return with a 400 error,
        if there are multiple files in the upload the "results" will have the errors.'
      operationId: uploadFile
      tags:
      - Files
      security:
      - apiToken: []
      parameters:
      - $ref: '#/components/parameters/param_orgid'
      - name: category
        in: query
        required: true
        schema:
          type: string
        description: The category of the file(s).
        example: uploads
      - name: filter
        in: query
        schema:
          type: string
          enum:
          - ogg
          - mp3
          - mono
          - norm
        description: Optionally convert audio files. Don't use this on non-audio files. The file is processed
          by the sox audio processor.
        example: mp3
      - name: video
        in: query
        schema:
          type: boolean
        description: 'We don''t recode video, if this option is set (any value), we check if the file
          is compatible with whatsapp, checking against its limitations: - needs to be h264 video - needs
          to have aac audio - smaller than 16MB - at least a second long

          We also add a thumbnail of the video to the storage system'
        example: false
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              type: object
              required:
              - upload
              properties:
                upload:
                  type: array
                  description: The file contents to upload. Can be repeated.
                  items:
                    type: string
                    format: binary
      responses:
        '200':
          description: The file was uploaded successfully.
          content:
            application/json:
              schema:
                type: object
                required:
                - filename
                - title
                - results
                - files
                properties:
                  filename:
                    type: string
                    description: The filename of the uploaded file. First file, if there are multiple
                      files uploaded.
                    example: 01-example.mp3
                  title:
                    type: string
                    description: The title of the uploaded file. First file, if there are multiple files
                      uploaded.
                    example: 01 - Example file
                  results:
                    type: object
                    description: Names of the originally uploaded files, with either an error or empty
                      string.
                    additionalProperties:
                      type: string
                    example:
                      listen.mp3: ''
                  files:
                    type: array
                    description: successfully uploaded and stored files
                    items:
                      type: object
                      required:
                      - filename
                      - title
                      - transcript
                      properties:
                        filename:
                          type: string
                        title:
                          type: string
                        transcript:
                          type: string
        '400':
          $ref: '#/components/responses/error_400'
        '401':
          $ref: '#/components/responses/error_401'
        '500':
          $ref: '#/components/responses/error_500'
