aid: engagespark
name: engageSPARK
description: >-
  engageSPARK is a mobile messaging and engagement platform for reaching hard-to-reach
  populations in low- and middle-income countries at scale. It lets NGOs, researchers,
  microfinance institutions, and businesses run SMS, automated voice (IVR), WhatsApp,
  and pre-paid airtime top-up campaigns across 180+ countries without writing code, or
  programmatically through its HTTP API. The engageSPARK API (api.engagespark.com, v1)
  exposes token-authenticated endpoints for sending SMS, WhatsApp, and airtime top-ups,
  managing contacts and organizations, subscribing and unsubscribing contacts to voice
  and SMS campaigns, reading message and top-up history, checking organization balance,
  and managing files. Incoming-SMS and campaign-action webhooks let the platform push
  survey responses and inbound messages into external systems such as Salesforce or
  Qualtrics.
